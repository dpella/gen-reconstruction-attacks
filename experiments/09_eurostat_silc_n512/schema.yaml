# Eurostat EU-SILC × HBS (Household Budget Survey) integrated flat file — n=512
#
# Schema origin: EU-SILC (Income & Living Conditions) and HBS (Household
# Budget Survey) are both SDMX-compliant Eurostat microdata surveys.
# NSIs routinely materialise an INTEGRATED per-household flat file for
# poverty-and-living-standards modelling — pairing EU-SILC's annual
# income/labour/health variables with HBS's 12-month expenditure diary
# across the COICOP classification. The integrated file is a standard
# analytical warehouse output.
#
# Construction: MIP base=8 with (p, c) = (0.5, 0.25), Hadamard k=7
# (six Sylvester doublings) → n=512 households. 511 per-column queries
# + 1 all-records = 512 queries. Each query aggregates p·n = 256
# households.
#
# Sensitive (not released): total_disposable_income — equivalised
# household disposable income (HY020 / HX090 in the EU-SILC DSD).
#
# All income subcomponents are OMITTED from the released schema.
# Note: monthly expenditure is released as a range predicate — this
# does NOT leak income because expenditure partially tracks income
# but is not a deterministic function of it (households differ in
# savings rate, debt, etc.).

name: eurostat_silc_n512
n_records: 512
seed: 42

mip_base: 8
hadamard_order: 7
population_value: 0.5
communality_value: 0.25
log_level: WARNING

sensitive_column: total_disposable_income

# 60 + 144 + 288 + 19 = 511
compression_groups:
  - name: age
    columns: [column_0, column_1, column_2]
    interval: 10   # years, 0-80
  - name: hh_size
    columns: [column_3, column_4, column_5]
    interval: 1   # HH size, 0-8
  - name: hh_children
    columns: [column_6, column_7, column_8]
    interval: 1   # children in HH, 0-8
