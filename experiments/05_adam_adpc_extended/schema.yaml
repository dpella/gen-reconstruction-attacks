# ADaM ADPC (extended: parent + metabolite, two-period crossover) — n=256
#
# Schema origin: CDISC ADaM Pharmacokinetic Concentrations dataset in its
# standard bioequivalence/bioavailability configuration: one row per subject,
# columns = PK concentrations of (parent drug + principal metabolite) at
# 20 nominal timepoints across two study periods (single-dose and
# steady-state). This is a routine FDA/EMA submission layout.
#
# Construction: MIP base=8 with (p, c) = (0.5, 0.25), Hadamard k=6
# (five Sylvester doublings) → n=256 subjects. 255 per-column queries +
# 1 all-records = 256 queries. Each query aggregates p·n = 128 subjects.
#
# Sensitive (not released): conc_24h — 24-hour post-dose PARENT-drug
# concentration in period 1. Clinically sensitive trough / CYP-phenotype
# proxy; not derivable from metabolite concentrations without the
# subject's (unknown) metabolic ratio.

name: adam_adpc_extended
n_records: 256
seed: 42

mip_base: 8
hadamard_order: 6
population_value: 0.5
communality_value: 0.25
log_level: WARNING

sensitive_column: conc_24h

# 79 × 3 + 15 + 3 = 255
compression_groups:
  - name: pc1_0h
    columns: [column_0, column_1, column_2]
    interval: 50   # parent, ng/mL, p1 t=0h
