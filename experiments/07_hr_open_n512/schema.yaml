# HR Open Standards (subject-level employee profile with 3 years of
# monthly KPIs — the 'integrated people-analytics warehouse' flat file) — n=512
#
# Schema origin: HR Open Standards / HR-XML. Enterprise HRIS warehouses
# (Workday, SuccessFactors, BambooHR) and consulting-firm people-analytics
# teams routinely materialize per-employee flat files with 3 years of
# monthly KPIs for downstream modeling (attrition, compensation equity,
# utilization forecasting). 511 released aggregates correspond to a
# typical BI dashboard's worth of per-cohort metrics.
#
# Construction: MIP base=8 with (p, c) = (0.5, 0.25), Hadamard k=7
# (six Sylvester doublings) → n=512 employees. 511 per-column queries +
# 1 all-records = 512 queries. Each query aggregates p·n = 256 employees.
#
# Sensitive (not released): salary — annual base salary.
# Derived comp fields (bonus, equity, total_comp, billing_rate) are
# OMITTED from the released schema — they are functions of salary.

name: hr_open_n512
n_records: 512
seed: 42

mip_base: 8
hadamard_order: 7
population_value: 0.5
communality_value: 0.25
log_level: WARNING

sensitive_column: salary

# 69 + 432 + 10 = 511
compression_groups:
  - name: age
    columns: [column_0, column_1, column_2]
    interval: 10   # years, 0-80
  - name: tenure_years
    columns: [column_3, column_4, column_5]
    interval: 5   # yrs at company, 0-40
  - name: years_experience
    columns: [column_6, column_7, column_8]
    interval: 6   # total career yrs, 0-48
  - name: years_in_role
    columns: [column_9, column_10, column_11]
    interval: 2   # yrs in current role, 0-16
  - name: years_in_company
    columns: [column_12, column_13, column_14]
    interval: 5   # yrs total in company group, 0-40
  - name: direct_reports
    columns: [column_15, column_16, column_17]
    interval: 3   # direct reports, 0-24
  - name: indirect_reports_span
    columns: [column_18, column_19, column_20]
    interval: 8   # indirect reports, 0-64
  - name: training_hours_y1
