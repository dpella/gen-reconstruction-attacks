# HR Open Standards (subject-level employee profile with 2 years of
# monthly metrics) — n=256
#
# Schema origin: HR Open Standards / HR-XML — the schema family used by
# enterprise HRIS (Workday, SuccessFactors, BambooHR) and consulting
# firms' people-analytics teams. One row per employee, columns = static
# career & demographic fields + 24 months of per-employee KPIs.
#
# Construction: MIP base=8 with (p, c) = (0.5, 0.25), Hadamard k=6
# (five Sylvester doublings) → n=256 employees. 255 per-column queries +
# 1 all-records = 256 queries. Each query aggregates p·n = 128 employees.
#
# Sensitive (not released): salary — annual base salary.
# This mirrors the paper's motivating scenario: a consulting firm
# publishes aggregate analytics over demographics, tenure, performance,
# and monthly billable-hours / utilization, while withholding per-
# employee salary — yet the release uniquely determines it.
#
# Derived compensation fields (bonus, equity, total_comp, billing_rate)
# are OMITTED from the released schema: they are functions of salary
# and would leak trivially.

name: hr_open_n256
n_records: 256
seed: 42

mip_base: 8
hadamard_order: 6
population_value: 0.5
communality_value: 0.25
log_level: WARNING

sensitive_column: salary

# 54 + 192 + 9 = 255
compression_groups:
  - name: age
    columns: [column_0, column_1, column_2]
    interval: 10   # years, 0-80
  - name: tenure_years
    columns: [column_3, column_4, column_5]
    interval: 5   # yrs at company, 0-40
  - name: years_experience
    columns: [column_6, column_7, column_8]
    interval: 6   # total career yrs, 0-48
  - name: years_in_role
    columns: [column_9, column_10, column_11]
    interval: 2   # yrs in current role, 0-16
  - name: direct_reports
    columns: [column_12, column_13, column_14]
