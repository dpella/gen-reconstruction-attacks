# ADaM ADPC (Pharmacokinetic Concentrations) — n=128
#
# Schema origin: CDISC ADaM Pharmacokinetic Concentrations dataset.
# Pivoted so each subject has one row, and each column is the PK
# concentration at one nominal timepoint in one study period
# (two-period crossover: single-dose [p1] + steady-state [p2]).
#
# Construction: MIP base=8 with (p, c) = (0.5, 0.25), Hadamard k=5
# (four Sylvester doublings) → n=128 subjects. 127 per-column queries +
# 1 all-records = 128 queries. Each query aggregates p·n = 64 subjects.
#
# Sensitive (not released): conc_24h — the 24-hour post-dose
# concentration in period 1 (trough surrogate / CYP-phenotype proxy).

name: adam_adpc
n_records: 128
seed: 42

mip_base: 8
hadamard_order: 5
population_value: 0.5
communality_value: 0.25
log_level: WARNING

sensitive_column: conc_24h

# 39 concentration columns × 3 bits + demographics + 3 binary = 127
compression_groups:
  - name: c1_0h
    columns: [column_0, column_1, column_2]
    interval: 50   # ng/mL, period 1 t=0h
  - name: c1_0_25h
    columns: [column_3, column_4, column_5]
    interval: 50   # ng/mL, period 1 t=0.25h
  - name: c1_0_5h
    columns: [column_6, column_7, column_8]
    interval: 50   # ng/mL, period 1 t=0.5h
